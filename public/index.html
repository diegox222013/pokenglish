<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PokéWords • English Adventure</title><style>:root{--bg:#091321;--panel:#101d30;--blue:#57b8ff;--green:#51df9b;--gold:#ffda55}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#29415e,#07101d 70%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:12px}.app{max-width:1100px;margin:auto}.top{height:52px;background:#07101ddd;border:1px solid #ffffff18;border-radius:18px 18px 0 0;display:flex;align-items:center;gap:10px;padding:0 16px}.ball{width:20px;height:20px;border-radius:50%;background:linear-gradient(#ff5268 0 45%,#fff 45% 55%,#54b9ff 55%);box-shadow:0 0 14px #57b8ff}.brand{font-weight:950}.online{margin-left:auto;color:#8ff0c1;font-size:12px}.dot{display:inline-block;width:7px;height:7px;background:#51df9b;border-radius:50%}.screen{background:linear-gradient(#17283e,#0b1524);border:1px solid #ffffff12;border-top:0;border-radius:0 0 20px 20px;padding:16px;min-height:640px;box-shadow:0 25px 60px #0009}#login-panel{min-height:600px;display:grid;place-items:center}.login{width:min(460px,100%);padding:30px;border-radius:26px;background:linear-gradient(145deg,#182d49,#0c1728);border:1px solid #ffffff18;box-shadow:0 20px 60px #0008}.logo{font-size:40px;font-weight:950;letter-spacing:-2px}.sub{color:#a8bad0;margin:4px 0 24px}.label{display:block;font-size:10px;color:#8ca4be;font-weight:900;letter-spacing:1px;margin:14px 0 7px}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff18;background:#071221;color:#fff;font:inherit;outline:0}input:focus,select:focus{border-color:var(--blue)}button{font:inherit;font-weight:900;color:#fff;cursor:pointer;border:0}.primary{width:100%;padding:15px;border-radius:13px;margin-top:16px;background:linear-gradient(135deg,#50b9ff,#6873ff);box-shadow:0 10px 25px #536cff33}#lobby-panel{display:none;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stat{background:#071322dd;border:1px solid #ffffff12;border-radius:13px;padding:8px 12px}.stat small{display:block;color:#7189a2;font-size:9px;font-weight:900}.timer{margin-left:auto;color:var(--gold);font-size:22px;font-weight:950}.admin{display:none;background:#ff536c;padding:10px 13px;border-radius:11px}#canvas-wrapper{display:none;position:relative;width:100%;overflow:hidden;border:3px solid #29435d;border-radius:18px;background:#65b96a;box-shadow:0 20px 50px #0008}canvas{display:block;width:100%;height:auto}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.card{background:#071322dd;border:1px solid #ffffff18;border-radius:12px;padding:8px 11px;backdrop-filter:blur(7px)}.name{font-weight:950;font-size:13px}.lvl{font-size:10px;color:#aabbd0}.hp{height:6px;width:170px;background:#29374a;border-radius:9px;margin-top:5px;overflow:hidden}.hp i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#4be39a,#c7ef69)}#zone{font-size:11px;color:#b5c8dc}#battle-console{display:none;margin-top:12px;background:linear-gradient(145deg,#f8fbff,#dce7f2);color:#142236;border-radius:18px;padding:14px}.head{display:flex;gap:9px;align-items:center;margin-bottom:7px}.badge{background:#14263c;color:#fff;padding:5px 9px;border-radius:99px;font-size:9px;font-weight:950}.challenge{font-weight:850;line-height:1.35}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}.battle{background:#fff;color:#172538;border:2px solid #b8c7d6;border-radius:12px;padding:10px}.battle:hover{border-color:#6375ff;transform:translateY(-1px)}.esp{font-size:10px;color:#718096;margin-top:2px}.toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;transition:.2s;background:#071322ee;border:1px solid #ffffff22;padding:10px 16px;border-radius:99px;z-index:9;font-size:13px;font-weight:850}.toast.show{opacity:1;transform:translate(-50%,0)}.controls{display:none;position:absolute;left:14px;right:14px;bottom:14px;justify-content:space-between;align-items:end}.stick{width:105px;height:105px;border-radius:50%;background:#07132299;border:2px solid #ffffff22;position:relative;touch-action:none}.knob{width:46px;height:46px;border-radius:50%;background:#ffffff2b;border:2px solid #ffffff55;position:absolute;left:28px;top:28px}.dpad{display:grid;grid-template-columns:55px 55px;gap:8px}.dpad button{width:55px;height:55px;border-radius:50%;background:#071322bb;border:2px solid #ffffff22}@media(max-width:700px){body{padding:7px}.screen{padding:8px}.top{height:47px}.hp{width:130px}.actions{grid-template-columns:repeat(2,1fr)}.controls{display:flex}.timer{font-size:18px}.stat:nth-child(2){display:none}}</style></head><body><div class="app"><header class="top"><span class="ball"></span><span class="brand">PokéWords</span><span style="color:#7890aa">ENGLISH ADVENTURE</span><span class="online"><i class="dot"></i> ONLINE</span></header><main class="screen"><section id="login-panel"><div class="login"><div class="logo">⚡ PokéWords</div><div class="sub">Explora • Aprende • Sube de nivel</div><label class="label">TRAINER NAME</label><input id="username" maxlength="18" value="Diegox222013" placeholder="Tu nombre..."><label class="label">STARTER POKÉMON</label><select id="pokemon-select"><option value="pikachu">Pikachu ⚡</option><option value="raichu">Raichu ⚡</option><option value="squirtle">Squirtle 💧</option><option value="charmander">Charmander 🔥</option><option value="bulbasaur">Bulbasaur 🌿</option><option value="pidgey">Pidgey 🪽</option></select><button class="primary" onclick="joinGame()">ENTRAR A LA AVENTURA →</button></div></section><section id="lobby-panel"><div class="stat"><small>TRAINER</small><b id="lbl-name">---</b></div><div class="stat"><small>PARTNER</small><b id="lbl-pokemon">---</b></div><div class="stat"><small>PLAYERS</small><b id="players">1</b></div><button id="start-room-btn" class="admin" onclick="startRoom()">⚡ START</button><div class="timer">⏱ <span id="timer">15:00</span></div></section><section id="canvas-wrapper"><canvas id="gameCanvas" width="960" height="540"></canvas><div class="hud"><div class="card"><div class="name" id="hud-name">TRAINER</div><div class="lvl">Lv. 1 • <span id="hud-pokemon">PIKACHU</span></div><div class="hp"><i></i></div></div><div class="card" id="zone">🌱 MEADOWS</div></div><div class="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="dpad"><button onclick="moveTouch(0,-1)">▲</button><button onclick="moveTouch(1,0)">▶</button><button onclick="moveTouch(-1,0)">◀</button><button onclick="moveTouch(0,1)">▼</button></div></div></section><section id="battle-console"><div class="head"><span class="badge">ENGLISH QUEST</span><span id="qzone">Exploration</span></div><div class="challenge" id="challenge">Muévete por el mapa para descubrir desafíos.</div><div class="actions"><button class="battle" onclick="answerQuestion(1)">▶ FIGHT<div class="esp">LUCHAR</div></button><button class="battle" onclick="answerQuestion(2)">🎒 ITEM<div class="esp">OBJETO</div></button><button class="battle" onclick="answerQuestion(3)">◉ PKMN<div class="esp">POKÉMON</div></button><button class="battle" onclick="answerQuestion(4)">↗ RUN<div class="esp">ESCAPAR</div></button></div></section></main></div><div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script>const socket=io(),canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),keys={};let myPlayer={name:'',pokemon:'pikachu',x:480,y:270,speed:4.2,stats:{hp:100,attack:50}},otherPlayers={},gameStarted=false,timeLeft=900,timerInterval=null,tick=0;const colors={pikachu:'#ffd928',raichu:'#f29a36',squirtle:'#56b8e9',charmander:'#ff784d',bulbasaur:'#68c76b',pidgey:'#b9a58e',rayquaza:'#42d392'},zones=[{n:'🌲 VERB FOREST',x:55,y:70,w:270,h:205},{n:'💧 BLUE LAKE',x:675,y:55,w:230,h:165},{n:'🏘️ VOCAB TOWN',x:650,y:330,w:255,h:155}];addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1700)}function joinGame(){let n=document.getElementById('username').value.trim();if(!n)return toast('Escribe un nombre');myPlayer.name=n;myPlayer.pokemon=document.getElementById('pokemon-select').value;if(n==='Diegox222013'){myPlayer.pokemon='rayquaza';myPlayer.speed=6.5;myPlayer.stats={hp:9999,attack:9999};document.getElementById('start-room-btn').style.display='block';toast('🔥 ADMIN • RAYQUAZA DESBLOQUEADO')}loginPanel.style.display='none';document.getElementById('lobby-panel').style.display='flex';document.getElementById('canvas-wrapper').style.display='block';document.getElementById('battle-console').style.display='block';document.getElementById('lbl-name').textContent=n;document.getElementById('lbl-pokemon').textContent=myPlayer.pokemon.toUpperCase();document.getElementById('hud-name').textContent=n;document.getElementById('hud-pokemon').textContent=myPlayer.pokemon.toUpperCase();socket.emit('joinPlayer',myPlayer);toast('🎮 ¡Bienvenido!')}const loginPanel=document.getElementById('login-panel');socket.on('stateUpdate',p=>{otherPlayers=p;document.getElementById('players').textContent=Object.keys(p).length});socket.on('roomStarted',()=>{if(!gameStarted){gameStarted=true;document.getElementById('start-room-btn').style.display='none';startTimer();toast('🚀 ¡AVENTURA INICIADA!')}});function startRoom(){socket.emit('triggerStart')}function startTimer(){if(timerInterval)return;timerInterval=setInterval(()=>{if(timeLeft<=0)return clearInterval(timerInterval);timeLeft--;document.getElementById('timer').textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(timeLeft%60).padStart(2,'0')},1000)}function moveTouch(dx,dy){if(!gameStarted&&myPlayer.name!=='Diegox222013')return;myPlayer.x=Math.max(24,Math.min(936,myPlayer.x+dx*24));myPlayer.y=Math.max(24,Math.min(516,myPlayer.y+dy*24));socket.emit('playerMove',{x:myPlayer.x,y:myPlayer.y});checkZone()}function update(){if(!myPlayer.name||(!gameStarted&&myPlayer.name!=='Diegox222013'))return;let dx=0,dy=0;if(keys.w||keys.W||keys.ArrowUp)dy--;if(keys.s||keys.S||keys.ArrowDown)dy++;if(keys.a||keys.A||keys.ArrowLeft)dx--;if(keys.d||keys.D||keys.ArrowRight)dx++;if(dx||dy){let l=Math.hypot(dx,dy);myPlayer.x=Math.max(24,Math.min(936,myPlayer.x+dx/l*myPlayer.speed));myPlayer.y=Math.max(24,Math.min(516,myPlayer.y+dy/l*myPlayer.speed));socket.emit('playerMove',{x:myPlayer.x,y:myPlayer.y});checkZone()}}function checkZone(){let z=zones.find(a=>myPlayer.x>a.x&&myPlayer.x<a.x+a.w&&myPlayer.y>a.y&&myPlayer.y<a.y+a.h);if(!z){zone.textContent='🌱 MEADOWS';qzone.textContent='Exploration';return}zone.textContent=z.n;qzone.textContent=z.n;if(z.n.includes('VERB'))challenge.innerHTML="A wild <b>Verb Challenge</b> appeared! Complete: <i>She _____ (go) to the store yesterday.</i>";else if(z.n.includes('VOCAB'))challenge.innerHTML="A wild <b>Vocabulary Challenge</b> appeared! Translate: <i>El pájaro vuela alto.</i>";else challenge.innerHTML="🌊 <b>Lake Challenge:</b> choose the English word for <i>agua</i>."}function answerQuestion(n){toast('⚡ Opción '+n+' seleccionada • Buff 2 incoming');draw()}function tree(x,y,s=1){ctx.fillStyle='#5a3c2c';ctx.fillRect(x-5*s,y+8*s,10*s,25*s);ctx.fillStyle='#1f7044';ctx.beginPath();ctx.arc(x,y,23*s,0,7);ctx.fill();ctx.fillStyle='#37a45b';ctx.beginPath();ctx.arc(x-13*s,y+5*s,16*s,0,7);ctx.arc(x+13*s,y+5*s,16*s,0,7);ctx.fill()}function building(x,y,c){ctx.fillStyle='#f1d19b';ctx.fillRect(x,y,80,72);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x-8,y+5);ctx.lineTo(x+40,y-28);ctx.lineTo(x+88,y+5);ctx.fill();ctx.fillStyle='#6b4935';ctx.fillRect(x+33,y+38,15,34);ctx.fillStyle='#74c9e8';ctx.fillRect(x+10,y+25,20,18);ctx.fillRect(x+50,y+25,20,18)}function draw(){tick++;ctx.clearRect(0,0,960,540);let g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#a0da7d');g.addColorStop(1,'#55aa65');ctx.fillStyle=g;ctx.fillRect(0,0,960,540);ctx.fillStyle='#e7ca8b';ctx.fillRect(405,0,150,540);ctx.fillRect(0,245,960,92);ctx.fillStyle='#f3dda2';ctx.fillRect(430,0,100,540);ctx.fillRect(0,263,960,56);ctx.fillStyle='#438e54';ctx.beginPath();ctx.roundRect(55,70,270,205,18);ctx.fill();ctx.fillStyle='#479fc8';ctx.fillRect(675,55,230,165);ctx.fillStyle='#c99d5b';ctx.beginPath();ctx.roundRect(650,330,255,155,18);ctx.fill();for(let i=0;i<65;i++){ctx.fillStyle='#ffffff18';ctx.fillRect((i*83)%960,(i*47)%540,2,2)}[[35,45,1],[355,50,.8],[615,40,.9],[925,275,1],[80,390,.9],[380,490,1],[600,465,.8],[930,475,.9],[335,350,.7],[580,300,.7]].forEach(a=>tree(...a));building(690,365,'#c75b58');building(795,365,'#687dc7');ctx.fillStyle='#ffffffdd';ctx.font='900 15px system-ui';ctx.fillText('VERB FOREST',92,105);ctx.fillText('BLUE LAKE',735,82);ctx.fillText('VOCAB TOWN',692,485);for(let id in otherPlayers)drawPlayer(otherPlayers[id]);drawPlayer(myPlayer)}function drawPlayer(p){let bob=Math.sin(tick*.12+p.x)*2,c=colors[p.pokemon]||'#ff6b6b',s=p.pokemon==='rayquaza'?42:30;ctx.save();ctx.translate(p.x,p.y+bob);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,18,s*.6,7,0,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,-2,s/2,0,7);ctx.fill();ctx.strokeStyle='#142236';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*.17,-s*.1,5,0,7);ctx.arc(s*.17,-s*.1,5,0,7);ctx.fill();ctx.fillStyle='#142236';ctx.beginPath();ctx.arc(-s*.17,-s*.1,2,0,7);ctx.arc(s*.17,-s*.1,2,0,7);ctx.fill();if(p.pokemon==='rayquaza'){ctx.strokeStyle='#43e09a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-28,5);ctx.quadraticCurveTo(-45,-20,-25,-35);ctx.stroke();ctx.beginPath();ctx.moveTo(28,5);ctx.quadraticCurveTo(45,-20,25,-35);ctx.stroke()}ctx.fillStyle='#071322dd';ctx.beginPath();ctx.roundRect(-42,-52,84,18,9);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 10px system-ui';ctx.textAlign='center';ctx.fillText(p.name||'Trainer',0,-39);ctx.restore()}function loop(){update();draw();requestAnimationFrame(loop)}loop();const stick=document.getElementById('stick'),knob=document.getElementById('knob');let drag=false;function joy(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.min(38,Math.hypot(x,y));if(!l)return;let a=Math.atan2(y,x);knob.style.transform=`translate(${Math.cos(a)*l}px,${Math.sin(a)*l}px)`;if(l>7)moveTouch(Math.cos(a),Math.sin(a))}stick.addEventListener('pointerdown',e=>{drag=true;stick.setPointerCapture(e.pointerId);joy(e)});stick.addEventListener('pointermove',e=>drag&&joy(e));stick.addEventListener('pointerup',()=>{drag=false;knob.style.transform='translate(0,0)'});stick.addEventListener('pointercancel',()=>{drag=false;knob.style.transform='translate(0,0)'})</script></body></html>
